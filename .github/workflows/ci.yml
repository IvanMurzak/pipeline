# CI for @baizor/pipeline — the standalone CLI.
#
# Two platforms, because this package has been bitten by platform differences
# before: an npm/bun shim divergence on Windows, and path handling that behaved
# differently under a non-interactive shell. `fail-fast: false` so a failure on
# one OS still reports the other rather than hiding it.
#
# The suite is run SEQUENTIALLY here (`bun test tests/`), not through the
# parallel runner used locally: CI runners are uncontended, while the
# git-worktree and subprocess-spawning suites flake under 8-worker load on a
# developer machine.
#
# ── THE HOOK RELAYS RUN IN THIS JOB (plugin-thin `p6`) ──────────────────────
# `src/hooks/` holds the five Claude Code hook relays — analytics · stats ·
# session · department-notifier · prompt-match — that used to be `.ts` scripts
# inside `pipeline-claude/hooks/`, spawned as `bun <relay>.ts`. They are now
# `pipeline hook <name>` subcommands, so a hook's version IS this package's
# version, and the plugin's `hooks/hooks.json` reaches them through
# `hooks/run-hook.sh` (which survives, and now resolves `pipeline` instead of
# `bun`).
#
# Their thirteen suites came with them — `tests/hook-*.test.ts`,
# `tests/mirror-*.test.ts` — and the "Run unit tests" step below is the job
# that executes them. A RELOCATED TEST NO JOB RUNS IS A DELETED TEST: that is
# why this is written down rather than left implicit in a directory glob.
# `tests/hook-subcommand.test.ts` additionally proves every registered name
# actually dispatches; the parity check against what the PLUGIN invokes needs
# both repositories on disk and lives in the parent monorepo's
# `tests/cross-repo/` suite.
#
# Windows is in the matrix for these specifically, not only out of caution:
# the daemon-lock suites turn on `wx` exclusive-create and real cross-process
# spawns, and the shim that resolves this binary for a hook is the one place
# this project has already been bitten by an npm/bun divergence there.
#
# ⚠ Never gate anything on a PIPED test command. `bun test … | tail -n` exits
# with TAIL's status, so a red suite reports success. Read the runner's own exit
# code — which is exactly what these steps do by not piping at all.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!.gitignore"
      - "!.gitattributes"
      - "!LICENSE"
      - "templates/**"
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!.gitignore"
      - "!.gitattributes"
      - "!LICENSE"
      - "templates/**"

jobs:
  test:
    name: Pipeline CLI
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run unit tests
        run: bun test tests/
      - name: CLI smoke (version + Node bundle build)
        run: |
          bun src/cli.ts --version
          bun run build
