# v2 manifest, generated by `pipeline migrate --to-manifest`.
#
# Everything about how this pipeline runs is declared here — nothing is
# inferred from a filename, a frontmatter block, or a section being present.
# A STEP IS NOT A FILE: it is an entry below, identified by its `name:`. The
# markdown under `body:` is only the prose it reads.
#
# Read it before the first run. Three things migration cannot decide for you:
#   * `needs:` is absent on every step, which means "the one before it" —
#     right for a chain, wrong if two steps could run at once.
#   * the `## Next` sections in the step files are now DEAD. The manifest
#     decides the order; delete them.
#   * `self_improve:` defaults to true. Freeze the steps whose job is to
#     catch a run that lied about succeeding.
schema: 2

name: support-answer

execution: sequential
isolation: none

vars:
  PP_DOCS_DIR: ./sample-docs
  PP_QUESTION: How do I get started?
  PP_TOP_K: "5"

steps:
  - name: retrieve
    self_improve: false
    type: script
    body: steps/retrieve.md
    script: scripts/bm25_retrieve.ts
    timeout: 120
    output:
      docs_dir:
        type: string
        required: true
        description: Absolute path the docs were actually read from — carried forward so downstream steps resolve `<docs_dir>/<file>` with no cwd ambiguity.
      candidates:
        type: array
        required: true
        description: Ranked {file, score, snippet} objects, score-descending; `file` is relative to docs_dir. EMPTY when nothing matched — a valid, successful result.

  - name: select
    body: steps/select.md

  - name: answer
    body: steps/answer.md

# Conditional routing, from the v1 `## Graph` section.
flow:
  retrieve:
    - { goto: select }
  select:
    - { goto: answer }
  answer:
    - { done: true }
